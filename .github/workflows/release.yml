name: Release

on:
    push:
        branches:
            - main
    # Manual rebuild of the binaries for an already-published tag (e.g. when a
    # build failed after the release was cut). Provide the existing tag.
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing tag to build binaries for (e.g. v0.1.0)'
                required: true

permissions:
    contents: write
    pull-requests: write

jobs:
    # Maintains a release PR from Conventional Commits (version bump +
    # CHANGELOG). Merging that PR creates the git tag + GitHub release, which
    # gates the binary build below. release_created is only true on that merge.
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release

    # Builds the unsigned macOS binary and uploads it to the release that
    # release-please just published. Runs in the same workflow because a tag
    # pushed with the default GITHUB_TOKEN does not trigger a separate
    # tag-listening workflow. Also runnable manually via workflow_dispatch to
    # rebuild an existing tag.
    publish-tauri:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        # Pinned to macos-15 (Apple Silicon, Xcode 16 / SDK 15.x) on purpose, NOT
        # macos-latest: ghostty pins Zig 0.15.2, and Zig 0.15.2 cannot link
        # against the macOS 26.4 SDK (ziglang/zig#31658). When GitHub migrates
        # macos-latest to macos-26 that SDK would silently break the libghostty
        # build, and we can't bump Zig (the pin forbids it). macos-15 keeps the
        # build on a pre-26.4 SDK. The dylib it produces is arm64, matching the
        # arm64 app binary tauri-action builds on this runner.
        runs-on: macos-15

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # libghostty-vt is a native dylib the app links at build time and
            # bundles into the .app (bundle.macOS.frameworks in tauri.conf.json).
            # Upstream ships no prebuilt per-commit binary, so build it from the
            # pinned ghostty commit with Zig — the exact path local dev uses
            # (scripts/setup-libghostty.sh). The bundler hard-errors "Library not
            # found" if the dylib is absent, so this MUST run before tauri-action.
            - name: Read pinned ghostty commit
              id: ghostty
              run: echo "sha=$(tr -d '[:space:]' < crates/mizraj-term-sys/vendor/VERSION)" >> "$GITHUB_OUTPUT"

            # Cache the built dylib on the pin SHA: the slow Zig download + ghostty
            # clone + ReleaseFast build only runs when vendor/VERSION moves.
            - name: Cache libghostty-vt dylib
              id: libghostty-cache
              uses: actions/cache@v4
              with:
                  path: target/libghostty
                  key: libghostty-${{ runner.os }}-${{ runner.arch }}-zig0.15.2-${{ steps.ghostty.outputs.sha }}

            - name: Build libghostty-vt
              if: steps.libghostty-cache.outputs.cache-hit != 'true'
              run: ./scripts/setup-libghostty.sh

            # Fail fast (cache hit or miss) if the artifact is wrong, and re-assert
            # the ad-hoc signature so dyld on arm64 — which refuses a dylib with no
            # cdhash — always accepts the bundled copy. Tauri copies the dylib
            # verbatim into Contents/Frameworks/, so this signature carries through.
            - name: Verify + ad-hoc sign libghostty-vt dylib
              run: |
                  test -f target/libghostty/libghostty.dylib
                  lipo -archs target/libghostty/libghostty.dylib
                  otool -D target/libghostty/libghostty.dylib
                  codesign --force -s - target/libghostty/libghostty.dylib
                  codesign -dv target/libghostty/libghostty.dylib

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
